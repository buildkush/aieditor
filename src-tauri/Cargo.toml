[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rfd = "0.15"
aiditor-speech = { path = "../native/speech" }

[patch.crates-io]
whisper-rs-sys = { path = "../native/whisper-rs-sys" }

[profile.dev.package.aiditor-speech]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

